[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ray-isolation-check"
version = "0.1.0"
description = "Run a job twice at once on one Ray cluster and report named actors the two runs share"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["ray[default]>=2.40", "psutil"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
ray-isolation-check = "ray_isolation_check.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
